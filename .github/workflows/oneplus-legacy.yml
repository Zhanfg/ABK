name: OnePlus Legacy 内核构建 (4.19 非GKI)

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      kernel_source:
        description: "内核源码仓库 URL"
        required: false
        type: string
        default: "https://github.com/shinichi-c/android_kernel_oneplus_sdm845"
      kernel_branch:
        description: "内核分支"
        required: false
        type: string
        default: "lineage-23.0-4.19"
      device_name:
        description: "设备 (enchilada / fajita / dumpling)"
        required: true
        type: choice
        options:
          - enchilada
          - fajita
          - dumpling
      defconfig:
        description: "Defconfig (相对于 arch/arm64/configs/)"
        required: false
        type: string
        default: "vendor/enchilada_defconfig"
      enable_susfs:
        description: "启用 SuSFS"
        required: false
        type: boolean
        default: true
      use_zram:
        description: "ZRAM LZ4KD 优化"
        required: false
        type: boolean
        default: false
      use_bbg:
        description: "Baseband Guard"
        required: false
        type: boolean
        default: false
      use_custom_external_modules:
        description: "启用自定义外部模块"
        required: false
        type: boolean
        default: false
      custom_external_modules:
        description: "外部模块清单 (URL;阶段|URL;阶段)"
        required: false
        type: string
        default: ""
      version:
        description: "自定义版本标签 (留空自动生成)"
        required: false
        type: string
        default: ""
      build_time:
        description: "自定义构建时间 (留空自动生成)"
        required: false
        type: string
        default: ""

env:
  KERNEL_SOURCE: ${{ inputs.kernel_source }}
  KERNEL_BRANCH: ${{ inputs.kernel_branch }}
  DEVICE_NAME: ${{ inputs.device_name }}
  DEFCONFIG: ${{ inputs.defconfig }}
  ENABLE_SUSFS: ${{ inputs.enable_susfs }}
  USE_ZRAM: ${{ inputs.use_zram }}
  USE_BBG: ${{ inputs.use_bbg }}
  USE_CUSTOM_EXTERNAL_MODULES: ${{ inputs.use_custom_external_modules }}
  CUSTOM_EXTERNAL_MODULES: ${{ inputs.custom_external_modules }}
  CUSTOM_VERSION: ${{ inputs.version }}
  CUSTOM_BUILD_TIME: ${{ inputs.build_time }}

jobs:
  build:
    name: "legacy-${{ inputs.device_name }}-4.19"
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      # ── 环境准备 ──────────────────────────────────────────────────────────

      - name: 检出 ABK 仓库
        uses: actions/checkout@v4

      - name: 最大化构建空间
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 4096
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"

      - name: 安装构建依赖
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            git build-essential bc flex bison libssl-dev \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            clang lld llvm python3 zip unzip cpio \
            device-tree-compiler libncurses-dev

      - name: 设置 ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          max-size: 2G
          key: legacy-${{ inputs.device_name }}-4.19

      - name: 构建信息摘要
        shell: bash
        run: |
          set -euo pipefail

          if [ -n "$CUSTOM_VERSION" ]; then
            VERSION_LABEL="$CUSTOM_VERSION"
          else
            VERSION_LABEL="ABK-legacy-${DEVICE_NAME}-$(date -u '+%Y%m%d-%H%M')"
          fi
          if [ -n "$CUSTOM_BUILD_TIME" ]; then
            BUILD_TIME="$CUSTOM_BUILD_TIME"
          else
            BUILD_TIME="$(date -u '+%Y%m%d%H%M%S')"
          fi

          case "$DEVICE_NAME" in
            enchilada) DEVICE_DISPLAY="OnePlus 6" ;;
            fajita)    DEVICE_DISPLAY="OnePlus 6T" ;;
            dumpling)  DEVICE_DISPLAY="OnePlus 6T (CN)" ;;
            *)         DEVICE_DISPLAY="$DEVICE_NAME" ;;
          esac

          echo "VERSION_LABEL=$VERSION_LABEL" >> "$GITHUB_ENV"
          echo "BUILD_TIME=$BUILD_TIME" >> "$GITHUB_ENV"
          echo "DEVICE_DISPLAY=$DEVICE_DISPLAY" >> "$GITHUB_ENV"

          echo "========================================"
          echo "    ABK Legacy 内核构建配置"
          echo "========================================"
          echo "构建目标      : OnePlus Legacy (非GKI)"
          echo "设备          : ${DEVICE_DISPLAY} (${DEVICE_NAME})"
          echo "内核源码      : ${KERNEL_SOURCE}"
          echo "内核分支      : ${KERNEL_BRANCH}"
          echo "Defconfig     : ${DEFCONFIG}"
          echo "内核版本      : 4.19"
          echo "Root 方案     : ReSukiSU (non-GKI)"
          echo "SuSFS         : ${ENABLE_SUSFS}"
          echo "ZRAM LZ4KD    : ${USE_ZRAM}"
          echo "BBG           : ${USE_BBG}"
          echo "版本标签      : ${VERSION_LABEL}"
          echo "========================================"

      # ── 拉取内核源码 ──────────────────────────────────────────────────────

      - name: 克隆内核源码
        shell: bash
        run: |
          set -euo pipefail
          git config --global user.name "abk-builder"
          git config --global user.email "abk-builder@users.noreply.github.com"
          git clone --depth=1 -b "$KERNEL_BRANCH" "$KERNEL_SOURCE" kernel
          cd kernel
          sed -i 's/ -dirty//g' scripts/setlocalversion
          sed -i '$i res=$(echo "$res" | sed '\''s/-dirty//g'\'')' scripts/setlocalversion
          git add -A && git commit -m "Remove -dirty suffix"

      # ── 集成 ReSukiSU ────────────────────────────────────────────────────

      - name: 集成 ReSukiSU + 内核 Hook 注入
        shell: bash
        run: |
          set -euo pipefail
          cd kernel

          echo "--- 克隆 ReSukiSU ---"
          git clone https://github.com/ReSukiSU/ReSukiSU KernelSU --depth=1
          cd KernelSU && git checkout main && cd ..

          echo "--- 注册 ReSukiSU 到构建系统 ---"
          ln -sf "$(pwd)/KernelSU/kernel" drivers/kernelsu
          grep -q "kernelsu" drivers/Makefile || echo "obj-\$(CONFIG_KSU) += kernelsu/" >> drivers/Makefile
          grep -q 'drivers/kernelsu/Kconfig' drivers/Kconfig || \
            sed -i '/endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig

          echo "--- 注入 KSU 内核 Hook (4.19 手动集成) ---"

          # 1. fs/exec.c - ksu_handle_execveat
          # shinichi-c: do_execveat_common 直接调用 __do_execve_file
          if ! grep -q "ksu_handle_execveat" fs/exec.c; then
            # extern 声明放在函数定义之前
            sed -i '/^static int do_execveat_common/i\#if IS_ENABLED(CONFIG_KSU)\nextern int ksu_handle_execveat(int *fd, struct filename **filename_ptr, void *argv, void *envp, int *flags);\n#endif\n' fs/exec.c
            # hook 调用放在 return __do_execve_file 之前
            sed -i '/return __do_execve_file/i\#if IS_ENABLED(CONFIG_KSU)\n\tksu_handle_execveat(&fd, &filename, &argv, &envp, &flags);\n#endif\n' fs/exec.c
            echo "  ✓ fs/exec.c: ksu_handle_execveat"
          fi

          # 2. fs/open.c - ksu_handle_faccessat
          # shinichi-c: do_faccessat 在 line 356, lookup_flags 在函数体中
          if ! grep -q "ksu_handle_faccessat" fs/open.c; then
            # extern 声明放在文件开头 (include 之后)
            sed -i '/^#include.*<linux/i\#if IS_ENABLED(CONFIG_KSU)\nextern int ksu_handle_faccessat(int *dfd, const char __user **filename_user, int *mode, int *flags);\n#endif\n' fs/open.c
            # hook 调用放在 do_faccessat 的 lookup_flags 赋值之后
            sed -i '/unsigned int lookup_flags = LOOKUP_FOLLOW;/a\\n#if IS_ENABLED(CONFIG_KSU)\n\tksu_handle_faccessat(&dfd, &filename, &mode, NULL);\n#endif' fs/open.c
            echo "  ✓ fs/open.c: ksu_handle_faccessat"
          fi

          # 3. fs/stat.c - ksu_handle_stat + ksu_handle_newfstat_ret + ksu_handle_fstat64_ret
          if ! grep -q "ksu_handle_stat" fs/stat.c; then
            # extern 声明
            sed -i '/^#include.*<linux/i\#if IS_ENABLED(CONFIG_KSU)\nextern int ksu_handle_stat(int *dfd, const char __user **filename_user, int *flags);\nextern void ksu_handle_newfstat_ret(unsigned int *fd, struct stat __user **statbuf_ptr);\nextern void ksu_handle_fstat64_ret(unsigned long *fd, struct stat64 __user **statbuf_ptr);\n#endif\n' fs/stat.c
            # ksu_handle_stat 在 vfs_statx 中
            sed -i '/unsigned int lookup_flags = LOOKUP_FOLLOW | LOOKUP_AUTOMOUNT;/a\\n#if IS_ENABLED(CONFIG_KSU)\n\tksu_handle_stat(&dfd, &filename, &flags);\n#endif' fs/stat.c
            # ksu_handle_newfstat_ret 在 SYSCALL_DEFINE2(newfstat,...) 的 return 前
            # shinichi-c: SYSCALL_DEFINE2(newfstat, 在 line 370
            sed -i '/SYSCALL_DEFINE2(newfstat/,/return error/{s/return error/#if IS_ENABLED(CONFIG_KSU)\n\tif (!error) ksu_handle_newfstat_ret(&fd, &statbuf);\n#endif\nreturn error/}' fs/stat.c
            # ksu_handle_fstat64_ret 在 SYSCALL_DEFINE2(fstat64,...) 的 return 前
            # shinichi-c: SYSCALL_DEFINE2(fstat64, 在 line 496
            sed -i '/SYSCALL_DEFINE2(fstat64/,/return error/{s/return error/#if IS_ENABLED(CONFIG_KSU)\n\tif (!error) ksu_handle_fstat64_ret(&fd, &statbuf);\n#endif\nreturn error/}' fs/stat.c
            echo "  ✓ fs/stat.c: ksu_handle_stat + newfstat_ret + fstat64_ret"
          fi

          # 4. kernel/reboot.c - ksu_handle_sys_reboot
          # shinichi-c: SYSCALL_DEFINE4(reboot,...) 在 line 308
          if ! grep -q "ksu_handle_sys_reboot" kernel/reboot.c; then
            # extern 声明放在 SYSCALL_DEFINE4(reboot) 之前
            sed -i '/^SYSCALL_DEFINE4(reboot,/i\#ifdef CONFIG_KSU\nextern int ksu_handle_sys_reboot(int magic1, int magic2, unsigned int cmd, void __user **arg);\n#endif\n' kernel/reboot.c
            # hook 调用放在 if (!ns_capable) 之前
            sed -i '/if (!ns_capable(pid_ns->user_ns, CAP_SYS_BOOT))/i\#ifdef CONFIG_KSU\n\tksu_handle_sys_reboot(magic1, magic2, cmd, &arg);\n#endif\n' kernel/reboot.c
            echo "  ✓ kernel/reboot.c: ksu_handle_sys_reboot"
          fi

          # 5. drivers/input/input.c - ksu_handle_input_handle_event
          if ! grep -q "ksu_handle_input_handle_event" drivers/input/input.c; then
            sed -i '/^static void input_handle_event/i\#if IS_ENABLED(CONFIG_KSU)\nextern int ksu_handle_input_handle_event(unsigned int *type, unsigned int *code, int *value);\n#endif\n' drivers/input/input.c
            sed -i '/int disposition = input_get_disposition/a\\n#if IS_ENABLED(CONFIG_KSU)\n\tksu_handle_input_handle_event(&type, &code, &value);\n#endif' drivers/input/input.c
            echo "  ✓ drivers/input/input.c: ksu_handle_input_handle_event"
          fi

          echo "--- Hook 注入完成 ---"

          echo "--- 写入 ReSukiSU 内核配置 ---"
          DEFCONFIG_FILE="arch/arm64/configs/$DEFCONFIG"
          # 启用 KSU 和 Manual Hook 模式
          cat >> "$DEFCONFIG_FILE" <<'CONF'
          CONFIG_KSU=y
          CONFIG_KSU_MANUAL_HOOK=y
          CONFIG_KSU_MANUAL_HOOK_AUTO_SETUID_HOOK=y
          CONFIG_KSU_MANUAL_HOOK_AUTO_INITRC_HOOK=y
          CONF

          echo "--- ReSukiSU 集成完成 ---"

      # ── 集成 SuSFS ───────────────────────────────────────────────────────

      - name: 集成 SuSFS
        if: ${{ inputs.enable_susfs == true }}
        shell: bash
        run: |
          echo "::warning::SuSFS 暂不支持 4.19 内核 (susfs4ksu 补丁不完整)。跳过 SuSFS 集成。"
          echo "SUSFS_SKIPPED=true" >> "$GITHUB_ENV"

      # ── 额外补丁 ──────────────────────────────────────────────────────────

      - name: ZRAM LZ4KD 优化
        if: ${{ inputs.use_zram == true }}
        shell: bash
        run: |
          set -euo pipefail
          cd kernel
          DEFCONFIG_FILE="arch/arm64/configs/$DEFCONFIG"
          cat >> "$DEFCONFIG_FILE" <<'CONF'
          CONFIG_ZSMALLOC=y
          CONFIG_ZRAM=y
          CONFIG_MODULE_SIG=n
          CONFIG_CRYPTO_LZ4KD=y
          CONFIG_ZRAM_DEF_COMP_LZ4KD=y
          CONF
          echo "--- ZRAM LZ4KD 配置已追加 ---"

      - name: Baseband Guard
        if: ${{ inputs.use_bbg == true }}
        shell: bash
        run: |
          set -euo pipefail
          cd kernel
          curl -fsSL https://github.com/vc-teahouse/Baseband-guard/raw/main/setup.sh | bash || {
            echo "::warning::BBG 补丁应用失败，跳过"
          }

      - name: 自定义外部模块
        if: ${{ inputs.use_custom_external_modules == true && inputs.custom_external_modules != '' }}
        shell: bash
        run: |
          set -euo pipefail
          export KERNEL_ROOT="$GITHUB_WORKSPACE/kernel"
          export DEFCONFIG_PATH="$KERNEL_ROOT/arch/arm64/$DEFCONFIG"
          export ZZH_PATCHES="$GITHUB_WORKSPACE"

          IFS='|' read -ra MODULES <<< "$CUSTOM_EXTERNAL_MODULES"
          for module_spec in "${MODULES[@]}"; do
            IFS=';' read -r module_url stage <<< "$module_spec"
            module_name=$(basename "$module_url" .git)
            echo "--- 外部模块: $module_name (阶段: $stage) ---"
            git clone --depth=1 "$module_url" "../$module_name"
            if [ -f "../$module_name/setup.sh" ]; then
              cd "../$module_name"
              bash setup.sh
              cd "$GITHUB_WORKSPACE/kernel"
            else
              echo "::warning::模块 $module_name 无 setup.sh，跳过"
            fi
          done

      # ── 编译内核 ──────────────────────────────────────────────────────────

      - name: 编译内核
        shell: bash
        run: |
          set -euo pipefail
          cd kernel

          export PATH="/usr/lib/ccache:$PATH"
          export KBUILD_BUILD_USER="abk"
          export KBUILD_BUILD_HOST="abk"
          export KBUILD_BUILD_VERSION=1
          export KBUILD_BUILD_TIMESTAMP="$BUILD_TIME"

          # 4.19 内核: Clang + GCC cross，LLVM=1
          make O=out \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CC="ccache clang" \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            LLVM=1 \
            "$DEFCONFIG"

          make -j"$(nproc --all)" O=out \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CC="ccache clang" \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            LLVM=1

          echo "--- 编译完成 ---"
          ls -lh out/arch/arm64/boot/Image* 2>/dev/null || {
            echo "::error::未找到内核镜像产物"
            exit 1
          }
          ccache -s

      # ── 打包 AnyKernel3 ──────────────────────────────────────────────────

      - name: 打包 AnyKernel3
        shell: bash
        run: |
          set -euo pipefail

          git clone https://github.com/osm0sis/AnyKernel3.git --depth=1
          rm -rf AnyKernel3/.git

          # 查找内核镜像 (Image.gz-dtb > Image.gz > Image)
          KERNEL_IMAGE=$(find kernel/out/arch/arm64/boot \
            -name "Image.gz-dtb" -o -name "Image.gz" -o -name "Image" | head -n 1)
          if [ -z "$KERNEL_IMAGE" ]; then
            echo "::error::未找到内核镜像"
            exit 1
          fi
          cp "$KERNEL_IMAGE" AnyKernel3/
          echo "--- 复制内核镜像: $(basename $KERNEL_IMAGE) ---"

          # 生成适配 OnePlus 6 的 anykernel.sh
          cat > AnyKernel3/anykernel.sh << 'AKSH'
          ### AnyKernel3 Ramdisk Mod Script
          ## osm0sis @ xda-developers

          ### AnyKernel setup
          properties() { '
          kernel.string=ABK Legacy · ReSukiSU · __DEVICE_DISPLAY__ · __BUILD_DATE__
          do.devicecheck=0
          do.modules=0
          do.systemless=0
          do.cleanup=1
          do.cleanuponabort=0
          supported.versions=
          supported.patchlevels=
          '; }

          block=boot;
          is_slot_device=auto;
          ramdisk_compression=auto;
          patch_vbmeta_flag=auto;

          . tools/ak3-core.sh;

          ## AnyKernel boot install
          dump_boot;

          vbmeta_disable_verification;

          write_boot;
          ## end boot install
          AKSH

          # 替换占位符
          sed -i "s/__DEVICE_DISPLAY__/${DEVICE_DISPLAY}/g" AnyKernel3/anykernel.sh
          sed -i "s/__BUILD_DATE__/$(date -u '+%Y-%m-%d')/g" AnyKernel3/anykernel.sh

          cd AnyKernel3
          ZIP_NAME="ABK_Legacy_${DEVICE_NAME}_ReSukiSU_${VERSION_LABEL}.zip"
          zip -r9 "../${ZIP_NAME}" ./*
          cd ..
          echo "--- AK3 打包完成 ---"
          ls -lh "${ZIP_NAME}"

          echo "ARTIFACT_NAME=ABK_Legacy_${DEVICE_NAME}_ReSukiSU_${VERSION_LABEL}" >> "$GITHUB_ENV"

      # ── 上传产物 ──────────────────────────────────────────────────────────

      - name: 上传 AnyKernel3
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ABK_Legacy_*.zip
          if-no-files-found: error
