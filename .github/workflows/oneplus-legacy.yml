name: OnePlus 6 内核编译 (4.19 预集成源码)

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:

env:
  KERNEL_SOURCE: "https://github.com/Zhanfg/kernel_oneplus_sdm845"
  KERNEL_BRANCH: "master"
  DEVICE_NAME: "enchilada"
  DEFCONFIG: "vendor/enchilada_defconfig"

jobs:
  build:
    name: "build-enchilada-4.19"
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: 检出 ABK 仓库
        uses: actions/checkout@v4

      - name: 最大化构建空间
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 4096
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"

      - name: 安装构建依赖
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git build-essential bc flex bison libssl-dev \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            clang lld llvm python3 zip unzip cpio \
            device-tree-compiler libncurses-dev

      - name: 设置 ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          max-size: 2G
          key: build-enchilada-4.19

      - name: 克隆预集成内核源码
        shell: bash
        run: |
          set -euo pipefail
          git config --global user.name "abk-builder"
          git config --global user.email "abk-builder@users.noreply.github.com"
          git clone --depth=1 -b "$KERNEL_BRANCH" "$KERNEL_SOURCE" kernel
          cd kernel
          sed -i 's/ -dirty//g' scripts/setlocalversion
          sed -i '$i res=$(echo "$res" | sed '\''s/-dirty//g'\'')' scripts/setlocalversion
          git add -A && git commit -m "Remove -dirty suffix" || true
          echo "--- 已集成: ReSukiSU/SuSFS v2.1.00/BBR/BBRv2/ipset/BBG/LZ4KD/NTSYNC/Docker ---"

      - name: 编译内核
        shell: bash
        run: |
          set -euo pipefail
          cd kernel

          export PATH="/usr/lib/ccache:$PATH"
          export KBUILD_BUILD_USER="abk"
          export KBUILD_BUILD_HOST="abk"
          export KBUILD_BUILD_VERSION=1
          export KBUILD_BUILD_TIMESTAMP="$(date -u '+%Y-%m-%d %H:%M:%S')"

          make O=out \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CC="ccache clang" \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            LLVM=1 \
            "$DEFCONFIG"

          make -j"$(nproc --all)" O=out \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CC="ccache clang" \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            LLVM=1

          echo "--- 编译完成 ---"
          ls -lh out/arch/arm64/boot/Image* 2>/dev/null || {
            echo "::error::未找到内核镜像产物"
            exit 1
          }

          # Build compressed Image.gz-dtb
          echo "--- 构建 Image.gz-dtb ---"
          make -j"$(nproc --all)" O=out \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CC="ccache clang" \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            LLVM=1 \
            Image.gz-dtb

          ls -lh out/arch/arm64/boot/Image.gz-dtb
          echo "--- 压缩完成 ---"

          DTBO_DIR=out/arch/arm64/boot/dts/qcom
          # Build ALL DTBO overlays (OnePlus 6/6T require this)
          echo "--- 强制编译所有 DTBO 覆盖层 ---"
          # Force compile specific dtbo overlays using dtc directly
          for dtbo in enchilada-evb-v2.1-overlay enchilada-t0-v2.1-overlay \
                      enchilada-evt1-v2.1-overlay enchilada-evt2-v2.1-overlay \
                      enchilada-evt2-cxo-v2.1-overlay enchilada-dvt-v2.1-overlay \
                      enchilada-dvt-v2.1-backup-overlay enchilada-dvt-v2.1-usb30-overlay \
                      enchilada-pvt-v2.1-overlay enchilada-pvt-v2.1-backup-overlay \
                      enchilada-mp-v2.1-overlay \
                      fajita-pvt-v2.1-overlay fajita-pvt-v2.1-bu-overlay \
                      fajita-pvt-v2.1-v1-overlay fajita-pvt-v2.1-spec-overlay \
                      fajita-mp-v2.1-spec-overlay; do
            src="arch/arm64/boot/dts/qcom/${dtbo}.dts"
            out="$DTBO_DIR/${dtbo}.dtbo"
            if [ -f "$src" ] && [ ! -f "$out" ]; then
              echo "  编译: $dtbo"
              ${CROSS_COMPILE:-}cpp -nostdinc -undef \
                -I arch/arm64/boot/dts/qcom \
                -I include \
                -I kernel/include \
                -include "include/generated/autoconf.h" \
                "$src" 2>/dev/null | dtc -@ -I dts -O dtb -o "$out" - || true
            fi
          done
          echo "--- 实际 DTBO 列表 ---"
          find "$DTBO_DIR" -name "enchilada*.dtbo" -o -name "fajita*.dtbo" | sort

          # Build dtbo.img from compiled DTBO overlays (OnePlus 6 requires this)
          echo "--- 从源码重建 dtbo.img ---"
          DTBO_DIR=out/arch/arm64/boot/dts/qcom
          # Include both enchilada (OnePlus 6) and fajita (OnePlus 6T) overlays
          DTBO_FILES=$(find "$DTBO_DIR" \( -name "enchilada*.dtbo" -o -name "fajita*.dtbo" \) 2>/dev/null | sort)
          if [ -n "$DTBO_FILES" ]; then
            echo "找到 DTBO 覆盖层:"
            echo "$DTBO_FILES" | while read f; do ls -lh "$f"; done
            # Use mkdtboimg.py to create proper dtbo.img with header
            curl -sL "https://raw.githubusercontent.com/K-Blaaaack/mkdtboimg/main/mkdtboimg.py" -o /tmp/mkdtboimg.py
            chmod +x /tmp/mkdtboimg.py
            python3 /tmp/mkdtboimg.py create "$DTBO_DIR/dtbo.img" $DTBO_FILES
            echo "✓ dtbo.img 已从源码重建 ($(du -h "$DTBO_DIR/dtbo.img" | cut -f1))"
            cp "$DTBO_DIR/dtbo.img" ./dtbo.img
          else
            echo "::warning::未找到 DTBO 文件，使用预置 dtbo.img"
            if [ -f "../../dtbo.img" ]; then
              cp ../../dtbo.img ./dtbo.img
            fi
          fi

          ccache -s

      - name: 打包 AnyKernel3
        shell: bash
        run: |
          set -euo pipefail
          cd kernel

          git clone https://github.com/osm0sis/AnyKernel3.git --depth=1
          rm -rf AnyKernel3/.git

          # Find kernel image - prefer compressed format (Image.gz-dtb)
          KERNEL_IMAGE=$(find out/arch/arm64/boot -name "Image.gz-dtb" | head -n 1)
          if [ -z "$KERNEL_IMAGE" ]; then
            KERNEL_IMAGE=$(find out/arch/arm64/boot \
              -name "Image.gz" -o -name "Image-dtb" -o -name "Image" | head -n 1)
          fi
          if [ -z "$KERNEL_IMAGE" ]; then
            echo "::error::未找到内核镜像"
            exit 1
          fi
          echo "Found kernel image: $KERNEL_IMAGE"
          cp "$KERNEL_IMAGE" AnyKernel3/

          # Also copy dtbo.img from ABK repo root
          echo "--- 查找 dtbo.img ---"
          echo "PWD: $(pwd)"
          ls -la dtbo.img 2>&1 || echo "当前目录无 dtbo.img"
          ls -la ../../dtbo.img 2>&1 || echo "ABK 根目录无 dtbo.img"
          ls -la ../dtbo.img 2>&1 || echo "上级目录无 dtbo.img"

          if [ -f "dtbo.img" ]; then
            echo "✓ 从当前目录 (kernel/) 复制 dtbo.img"
            cp dtbo.img AnyKernel3/
          elif [ -f "../../dtbo.img" ]; then
            echo "✓ 从 ABK 根目录复制 dtbo.img"
            cp ../../dtbo.img AnyKernel3/
          elif [ -f "../dtbo.img" ]; then
            echo "✓ 从上级目录复制 dtbo.img"
            cp ../dtbo.img AnyKernel3/
          else
            echo "::error::dtbo.img 未找到！设备需要此文件"
            exit 1
          fi
          ls -lh AnyKernel3/dtbo.img

          # vbmeta-disable-verification (libxzr release - arm64 for OnePlus 6)
          curl -sL "https://github.com/libxzr/vbmeta-disable-verification/releases/download/v1.0/vbmeta-disable-verification.zip" -o /tmp/vbmeta.zip 2>/dev/null
          if [ -s /tmp/vbmeta.zip ]; then
            unzip -j /tmp/vbmeta.zip "arm64-v8a/vbmeta-disable-verification" -d AnyKernel3/tools/ 2>/dev/null
            if [ -f AnyKernel3/tools/vbmeta-disable-verification ]; then
              chmod +x AnyKernel3/tools/vbmeta-disable-verification
              echo "✓ vbmeta-disable-verification 已添加 ($(du -h AnyKernel3/tools/vbmeta-disable-verification | cut -f1))"
            else
              echo "⚠ vbmeta-disable-verification 提取失败（zip 内容结构异常）"
            fi
          else
            echo "⚠ vbmeta-disable-verification 下载失败（可选，不影响刷机）"
          fi

          echo "" | base64 -d > AnyKernel3/anykernel.sh

          cd AnyKernel3
          ZIP_NAME="ABK_OnePlus6_Enchilada_ReSukiSU_SuSFS210_$(date -u '+%Y%m%d-%H%M').zip"
          # Explicit file list to avoid .gitignore interference with wildcards
          zip -r9 "../${ZIP_NAME}" Image.gz-dtb anykernel.sh LICENSE README.md META-INF/ tools/ modules/ patch/ ramdisk/
          if [ -f "dtbo.img" ]; then
            zip -j "../${ZIP_NAME}" dtbo.img
            echo "✓ dtbo.img 已加入 ZIP ($(du -h dtbo.img | cut -f1))"
          else
            echo "⚠ dtbo.img 缺失!"
            ls -la dtbo.img 2>&1 || true
          fi

          # Sign the zip (required by stock OxygenOS recovery)
          cd ..
          echo "--- 签名 ZIP (OxygenOS recovery) ---"
          KEY_DIR=$(mktemp -d)

          # Generate test key pair using keytool + openssl
          keytool -genkeypair -v -keystore "$KEY_DIR/testkey.jks" -alias testkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass testkey -keypass testkey \
            -dname "CN=AnyKernel3, OU=ABK, O=ABK" 2>/dev/null

          # Convert JKS to PKCS8 for jarsigner
          # jarsigner can sign directly with JKS keystore
          jarsigner -keystore "$KEY_DIR/testkey.jks" -storepass testkey -keypass testkey \
            -signedjar "${ZIP_NAME}.signed" "${ZIP_NAME}" testkey 2>/dev/null

          if [ -f "${ZIP_NAME}.signed" ]; then
            mv "${ZIP_NAME}.signed" "${ZIP_NAME}"
            echo "✓ ZIP 已签名 (jarsigner)"
          else
            echo "⚠ jarsigner 签名失败，尝试使用 signapk"
            openssl genrsa -out "$KEY_DIR/testkey.pem" 2048 2>/dev/null
            openssl req -new -x509 -key "$KEY_DIR/testkey.pem" -out "$KEY_DIR/testkey.x509.pem" -days 10000 -subj "/CN=AnyKernel3" 2>/dev/null
            openssl pkcs8 -topk8 -inform PEM -in "$KEY_DIR/testkey.pem" -outform DER -nocrypt -out "$KEY_DIR/testkey.pk8" 2>/dev/null
            curl -sL "https://raw.githubusercontent.com/nickyzhang/SignApk/master/signapk.jar" -o /tmp/signapk.jar 2>/dev/null
            if [ -s /tmp/signapk.jar ] && java -version 2>/dev/null; then
              java -jar /tmp/signapk.jar "$KEY_DIR/testkey.x509.pem" "$KEY_DIR/testkey.pk8" "${ZIP_NAME}" "${ZIP_NAME}.signed" 2>/dev/null && mv "${ZIP_NAME}.signed" "${ZIP_NAME}"
              echo "✓ ZIP 已签名 (signapk)"
            fi
          fi
          rm -rf "$KEY_DIR"

          echo "--- 打包完成 ---"
          ls -lh "${ZIP_NAME}"
          echo "ARTIFACT_NAME=${ZIP_NAME%.zip}" >> "$GITHUB_ENV"

      - name: 上传 AnyKernel3
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: kernel/ABK_OnePlus6_*.zip
          if-no-files-found: error
